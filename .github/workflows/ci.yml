name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TREE_SITTER_CLI: 0.27.2
  # The revisions nvim-treesitter (main) pins for these parsers.
  GROOVY_REVISION: 2a6ddd558b6aa39c5b77d8db9fe9baf817486b2c
  HTML_REVISION: 73a3947324f6efddf9e17c0ea58d454843590cc0

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_CLI }}
      - name: Generated parser is up to date
        working-directory: tree-sitter-gsp
        run: tree-sitter generate && git diff --exit-code -- src
      - name: Corpus tests
        working-directory: tree-sitter-gsp
        run: tree-sitter test -p .

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.3, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_CLI }}
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Build the groovy and html parsers
        run: |
          parsers="$RUNNER_TEMP/data/nvim/site/parser"
          mkdir -p "$parsers"
          build() {
            git clone --quiet "$2" "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" checkout --quiet "$3"
            tree-sitter build -o "$parsers/$1.so" "$RUNNER_TEMP/$1"
          }
          build groovy https://github.com/murtaza64/tree-sitter-groovy "$GROOVY_REVISION"
          build html https://github.com/tree-sitter/tree-sitter-html "$HTML_REVISION"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
      - name: Tests
        run: nvim --headless -u tests/minimal_init.lua -l tests/run.lua

  # tests/spec/integration_spec.lua against a jar built from the server's main, on its fixtures/grails4 (JDK 11).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grails.nvim
      - uses: actions/checkout@v4
        with:
          repository: vdassios/grails-language-server
          ref: main
          path: grails-language-server
      # 17 builds the server (Gradle 9); 11 (listed last, so JAVA_HOME) runs it and the fixture's Gradle 6.9.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            11
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the server jar
        working-directory: grails-language-server
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew shadowJar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_CLI }}
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Build the groovy and html parsers
        run: |
          parsers="$RUNNER_TEMP/data/nvim/site/parser"
          mkdir -p "$parsers"
          build() {
            git clone --quiet "$2" "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" checkout --quiet "$3"
            tree-sitter build -o "$parsers/$1.so" "$RUNNER_TEMP/$1"
          }
          build groovy https://github.com/murtaza64/tree-sitter-groovy "$GROOVY_REVISION"
          build html https://github.com/tree-sitter/tree-sitter-html "$HTML_REVISION"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
      - name: Integration spec
        working-directory: grails.nvim
        shell: bash
        env:
          GRAILS_LS_JAR: ${{ github.workspace }}/grails-language-server/build/libs/grails-language-server-all.jar
          GRAILS_LS_FIXTURE: ${{ github.workspace }}/grails-language-server/fixtures/grails4
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        # print() goes to stderr under --headless, hence 2>&1. The grep fails the job if the spec ran no test.
        run: |
          nvim --headless -u tests/minimal_init.lua -l tests/run.lua integration_spec 2>&1 | tee "$RUNNER_TEMP/out"
          grep -q '^ok    integration_spec' "$RUNNER_TEMP/out"
